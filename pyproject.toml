[build-system]
requires = ["setuptools>=82.0.1,<83", "wheel>=0.47,<0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tunner"
version = "0.1.0"
description = "Desktop GUI to customize open LLMs with PDF knowledge (RAG-first, optional QLoRA fine-tuning)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [{ name = "LLM-tunner contributors" }]
keywords = ["llm", "rag", "fine-tuning", "qlora", "pdf", "pyside6", "gui"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies. Heavy ML extras live in [project.optional-dependencies] so the
# GUI can install and launch on machines without a full training stack.
dependencies = [
    "PySide6-Essentials>=6.11.1,<7",
    "pyqtgraph>=0.14,<0.15",
    "pypdf>=6.13.2,<7",
]

[project.optional-dependencies]
# RAG knowledge path (works on CPU/MPS/CUDA).
rag = [
    "torch>=2.12,<3",
    "chromadb>=1.5.9,<2",
    "docling>=2.102.1,<3",
    "transformers>=5.12,<6",
    "huggingface-hub>=1.19,<2",
    "onnxruntime>=1.26,<2",
    "tokenizers>=0.22.2,<0.23",
]
# Fine-tuning path (transformers + PEFT + TRL).
train = [
    "torch>=2.12,<3",
    "transformers>=5.12,<6",
    "peft>=0.19.1,<1",
    "trl>=1.6,<2",
    "datasets>=5,<6",
    "accelerate>=1.14,<2",
    "matplotlib>=3.11,<4",
    "huggingface-hub>=1.19,<2",
]
# 4-bit QLoRA backend. CUDA only; declared as an explicit opt-in extra.
gpu = [
    "bitsandbytes>=0.49.2,<0.50; platform_system == 'Linux' or (platform_system == 'Windows' and platform_machine == 'AMD64')",
]
# Everything for a full local install.
all = [
    "llm-tunner[rag,train]",
]
dev = [
    "build>=1.5,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.17,<0.16",
]

[project.scripts]
llm-tunner = "llm_tunner.app:main"

[project.gui-scripts]
llm-tunner-gui = "llm_tunner.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_tunner = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
