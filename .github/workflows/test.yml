name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes
      # PySide6's offscreen Qt platform needs EGL/GL/xkb system libraries that the
      # bare Ubuntu runner image does not ship; the GUI smoke tests import QtWidgets.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      # Run via bash on every OS so Make uses a POSIX shell for recipes
      # (matches local development and avoids cmd.exe quoting differences).
      - name: Lint and test via Makefile
        shell: bash
        # UPGRADE_ARGS= forces a plain (non-eager) install so the resolved
        # dependency set stays reproducible and the pip cache stays effective.
        run: make ci PYTHON=python UPGRADE_ARGS=
